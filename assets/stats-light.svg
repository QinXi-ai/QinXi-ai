<svg xmlns="http://www.w3.org/2000/svg" width="900" height="132" viewBox="0 0 900 132" role="img" aria-label="1 arXiv paper · 58 upstream PRs merged · 27 external repositories · 4 national awards">
<title>1 arXiv paper · 58 upstream PRs merged · 27 external repositories · 4 national awards</title>
<style>
.serif{font-family:Georgia, 'Times New Roman', 'Songti SC', 'STSong', SimSun, serif}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.cjk{font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif}
.ink{fill:#1B1D1B}.muted{fill:#6E6B62}.accent{fill:#8B2F25}
.cap{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11px;letter-spacing:2.2px;fill:#6E6B62}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
.fade{opacity:0;animation:fade 1.2s ease forwards}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.6,0,.2,1) forwards}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 2s cubic-bezier(.6,0,.2,1) forwards}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.rise,.fade,.grow,.draw,.blink{animation:none;opacity:1;transform:none;stroke-dashoffset:0}}
</style>
<rect width="900" height="132" rx="8" fill="#F3F0E8"/>
<line x1="40" y1="0.5" x2="860" y2="0.5" stroke="#D8D1C1"/>
<line x1="40" y1="131.5" x2="860" y2="131.5" stroke="#D8D1C1"/><g class="rise" style="animation-delay:0.1s">
  <text x="40" y="70" class="serif ink" font-size="46" letter-spacing="-1">1</text>
  <text x="40" y="94" class="mono ink" font-size="12" letter-spacing=".4">arXiv paper</text>
  <text x="40" y="112" class="mono muted" font-size="10.5">v3 · 2026</text>
</g><line x1="245" y1="28" x2="245" y2="104" stroke="#D8D1C1"/><g class="rise" style="animation-delay:0.22s">
  <text x="269" y="70" class="serif accent" font-size="46" letter-spacing="-1">58</text>
  <text x="269" y="94" class="mono ink" font-size="12" letter-spacing=".4">upstream PRs merged</text>
  <text x="269" y="112" class="mono muted" font-size="10.5">query engines → agents</text>
</g><line x1="450" y1="28" x2="450" y2="104" stroke="#D8D1C1"/><g class="rise" style="animation-delay:0.33999999999999997s">
  <text x="474" y="70" class="serif ink" font-size="46" letter-spacing="-1">27</text>
  <text x="474" y="94" class="mono ink" font-size="12" letter-spacing=".4">external repositories</text>
  <text x="474" y="112" class="mono muted" font-size="10.5">Rust · Python · TS · C</text>
</g><line x1="655" y1="28" x2="655" y2="104" stroke="#D8D1C1"/><g class="rise" style="animation-delay:0.45999999999999996s">
  <text x="679" y="70" class="serif ink" font-size="46" letter-spacing="-1">4</text>
  <text x="679" y="94" class="mono ink" font-size="12" letter-spacing=".4">national awards</text>
  <text x="679" y="112" class="mono muted" font-size="10.5">incl. 2 first prizes</text>
</g><text x="860" y="22" text-anchor="end" class="cap" font-size="9">AS OF OCT 2026</text>
</svg>
