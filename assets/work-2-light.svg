<svg xmlns="http://www.w3.org/2000/svg" width="440" height="176" viewBox="0 0 440 176" role="img" aria-label="Pocket MOSS Image — Low-memory MOSS-Image inference: the original 9B text encoder with packed INT6 weights and a streamed, fused INT8 DiT. No retraining or replacement encoder.">
<title>Pocket MOSS Image — Low-memory MOSS-Image inference: the original 9B text encoder with packed INT6 weights and a streamed, fused INT8 DiT. No retraining or replacement encoder.</title>
<style>
.serif{font-family:Georgia, 'Times New Roman', 'Songti SC', 'STSong', SimSun, serif}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.cjk{font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif}
.ink{fill:#1B1D1B}.muted{fill:#6E6B62}.accent{fill:#8B2F25}
.cap{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11px;letter-spacing:2.2px;fill:#6E6B62}
.rise,.fade,.grow,.draw,.blink{opacity:1;transform:none;stroke-dashoffset:0}
</style>
<rect x="0.5" y="0.5" width="439" height="175" rx="6" fill="#F7F5EF" stroke="#D8D1C1"/>
<text x="26" y="36" class="mono accent" font-size="11" letter-spacing="1.5">02</text>
<text x="414" y="36" text-anchor="end" class="cap" font-size="9.5">PYTHON / PYTORCH</text>
<g class="rise"><text x="26" y="74" class="serif ink" font-size="23" letter-spacing="-.2">Pocket MOSS Image<tspan class="accent" font-size="16"> ↗</tspan></text></g><text x="26" y="106" class="serif muted fade" font-size="14.5" style="animation-delay:0.2s">Low-memory MOSS-Image inference: the original 9B text</text><text x="26" y="127" class="serif muted fade" font-size="14.5" style="animation-delay:0.2s">encoder with packed INT6 weights and a streamed, fused</text><text x="26" y="148" class="serif muted fade" font-size="14.5" style="animation-delay:0.2s">INT8 DiT. No retraining or replacement encoder.</text>
</svg>
