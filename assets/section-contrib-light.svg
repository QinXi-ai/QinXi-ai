<svg xmlns="http://www.w3.org/2000/svg" width="900" height="112" viewBox="0 0 900 112" role="img" aria-label="02 OPEN-SOURCE CONTRIBUTIONS — Changes that landed">
<title>02 OPEN-SOURCE CONTRIBUTIONS — Changes that landed</title>
<style>
.serif{font-family:Georgia, 'Times New Roman', 'Songti SC', 'STSong', SimSun, serif}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.cjk{font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif}
.ink{fill:#1B1D1B}.muted{fill:#6E6B62}.accent{fill:#8B2F25}
.cap{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11px;letter-spacing:2.2px;fill:#6E6B62}
.rise,.fade,.grow,.draw,.blink{opacity:1;transform:none;stroke-dashoffset:0}
</style>

<rect width="900" height="112" rx="8" fill="#F3F0E8"/>
<g class="rise">
  <text x="40" y="40" class="mono accent" font-size="12" letter-spacing="2">02</text>
  <line x1="66" y1="36" x2="96" y2="36" stroke="#8B2F25"/>
  <text x="106" y="40" class="cap">OPEN-SOURCE CONTRIBUTIONS</text>
  <text x="40" y="86" class="serif ink" font-size="36" letter-spacing="-.6">Changes that landed</text>
</g>
<g class="fade" style="animation-delay:0.3s">
  <text x="860" y="66" text-anchor="end" class="serif accent" font-size="18" font-style="italic">Res ipsa loquitur</text>
  <text x="860" y="86" text-anchor="end" class="cap" font-size="9">THE WORK SPEAKS FOR ITSELF</text>
</g>
<line x1="40" y1="111" x2="860" y2="111" stroke="#D8D1C1" class="draw" style="animation-delay:0.2s"/>
</svg>
