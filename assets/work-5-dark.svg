<svg xmlns="http://www.w3.org/2000/svg" width="440" height="176" viewBox="0 0 440 176" role="img" aria-label="AstroTwin — A browser-based astronomy research demo with TESS evidence snapshots, guided analyses, and Qwen-assisted planning.">
<title>AstroTwin — A browser-based astronomy research demo with TESS evidence snapshots, guided analyses, and Qwen-assisted planning.</title>
<style>
.serif{font-family:Georgia, 'Times New Roman', 'Songti SC', 'STSong', SimSun, serif}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.cjk{font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif}
.ink{fill:#ECE7DA}.muted{fill:#9D998C}.accent{fill:#D97C69}
.cap{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11px;letter-spacing:2.2px;fill:#9D998C}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
.fade{opacity:0;animation:fade 1.2s ease forwards}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.6,0,.2,1) forwards}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 2s cubic-bezier(.6,0,.2,1) forwards}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.rise,.fade,.grow,.draw,.blink{animation:none;opacity:1;transform:none;stroke-dashoffset:0}}
</style>
<rect x="0.5" y="0.5" width="439" height="175" rx="6" fill="#1A1B18" stroke="#36362F"/>
<text x="26" y="36" class="mono accent" font-size="11" letter-spacing="1.5">05</text>
<text x="414" y="36" text-anchor="end" class="cap" font-size="9.5">JAVASCRIPT</text>
<g class="rise"><text x="26" y="74" class="serif ink" font-size="23" letter-spacing="-.2">AstroTwin<tspan class="accent" font-size="16"> ↗</tspan></text></g><text x="26" y="106" class="serif muted fade" font-size="14.5" style="animation-delay:0.2s">A browser-based astronomy research demo with TESS</text><text x="26" y="127" class="serif muted fade" font-size="14.5" style="animation-delay:0.2s">evidence snapshots, guided analyses, and Qwen-assisted</text><text x="26" y="148" class="serif muted fade" font-size="14.5" style="animation-delay:0.2s">planning.</text>
</svg>
