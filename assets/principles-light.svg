<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Principles: Lex me quoque ligat. In dubio, siste. Nihil ultra testimonium. Festina lente.">
<title>Principles: Lex me quoque ligat. In dubio, siste. Nihil ultra testimonium. Festina lente.</title>
<style>
.serif{font-family:Georgia, 'Times New Roman', 'Songti SC', 'STSong', SimSun, serif}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.cjk{font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif}
.ink{fill:#1B1D1B}.muted{fill:#6E6B62}.accent{fill:#8B2F25}
.cap{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11px;letter-spacing:2.2px;fill:#6E6B62}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
.fade{opacity:0;animation:fade 1.2s ease forwards}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.6,0,.2,1) forwards}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 2s cubic-bezier(.6,0,.2,1) forwards}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.rise,.fade,.grow,.draw,.blink{animation:none;opacity:1;transform:none;stroke-dashoffset:0}}
</style>
<rect width="900" height="300" rx="8" fill="#F3F0E8"/>
<line x1="0" y1="32" x2="900" y2="32" stroke="#E9E4D8" stroke-width="1"/><line x1="0" y1="64" x2="900" y2="64" stroke="#E9E4D8" stroke-width="1"/><line x1="0" y1="96" x2="900" y2="96" stroke="#E9E4D8" stroke-width="1"/><line x1="0" y1="128" x2="900" y2="128" stroke="#E9E4D8" stroke-width="1"/><line x1="0" y1="160" x2="900" y2="160" stroke="#E9E4D8" stroke-width="1"/><line x1="0" y1="192" x2="900" y2="192" stroke="#E9E4D8" stroke-width="1"/><line x1="0" y1="224" x2="900" y2="224" stroke="#E9E4D8" stroke-width="1"/><line x1="0" y1="256" x2="900" y2="256" stroke="#E9E4D8" stroke-width="1"/><line x1="0" y1="288" x2="900" y2="288" stroke="#E9E4D8" stroke-width="1"/>
<text x="40" y="44" class="cap">THREE OPERATING PRINCIPLES</text>
<text x="40" y="90" class="serif ink" font-size="34" letter-spacing="-.5">Bound by the record</text><g class="rise" style="animation-delay:0.15s">
  <line x1="40" y1="124" x2="289.3333333333333" y2="124" stroke="#1B1D1B"/>
  <text x="40" y="150" class="mono accent" font-size="11" letter-spacing="1.5">01</text>
  <text x="40" y="186" class="serif ink" font-size="21" font-style="italic">Lex me quoque ligat.</text>
  <text x="40" y="210" class="cap" font-size="9">THE LAW BINDS ME TOO.</text>
</g><g class="rise" style="animation-delay:0.3s">
  <line x1="313.3333333333333" y1="124" x2="562.6666666666666" y2="124" stroke="#1B1D1B"/>
  <text x="313.3333333333333" y="150" class="mono accent" font-size="11" letter-spacing="1.5">02</text>
  <text x="313.3333333333333" y="186" class="serif ink" font-size="21" font-style="italic">In dubio, siste.</text>
  <text x="313.3333333333333" y="210" class="cap" font-size="9">WHEN IN DOUBT, STOP.</text>
</g><g class="rise" style="animation-delay:0.44999999999999996s">
  <line x1="586.6666666666666" y1="124" x2="836" y2="124" stroke="#1B1D1B"/>
  <text x="586.6666666666666" y="150" class="mono accent" font-size="11" letter-spacing="1.5">03</text>
  <text x="586.6666666666666" y="186" class="serif ink" font-size="21" font-style="italic">Nihil ultra testimonium.</text>
  <text x="586.6666666666666" y="210" class="cap" font-size="9">NOTHING BEYOND THE EVIDENCE.</text>
</g>
<line x1="40" y1="244" x2="860" y2="244" stroke="#D8D1C1"/>
<text x="40" y="276" class="serif accent" font-size="20" font-style="italic">Festina lente.</text>
<text x="190" y="275" class="cap" font-size="9">MAKE HASTE SLOWLY.</text>
<text x="860" y="275" text-anchor="end" class="mono ink" font-size="11.5" letter-spacing="1">LET'S COMPARE NOTES <tspan class="accent">→</tspan></text>
</svg>
