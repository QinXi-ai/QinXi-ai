<svg xmlns="http://www.w3.org/2000/svg" width="900" height="112" viewBox="0 0 900 112" role="img" aria-label="01 FEATURED RESEARCH — Claim-relative inference">
<title>01 FEATURED RESEARCH — Claim-relative inference</title>
<style>
.serif{font-family:Georgia, 'Times New Roman', 'Songti SC', 'STSong', SimSun, serif}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.cjk{font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif}
.ink{fill:#ECE7DA}.muted{fill:#9D998C}.accent{fill:#D97C69}
.cap{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11px;letter-spacing:2.2px;fill:#9D998C}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
.fade{opacity:0;animation:fade 1.2s ease forwards}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.4s cubic-bezier(.6,0,.2,1) forwards}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 2s cubic-bezier(.6,0,.2,1) forwards}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.rise,.fade,.grow,.draw,.blink{animation:none;opacity:1;transform:none;stroke-dashoffset:0}}
</style>

<rect width="900" height="112" rx="8" fill="#151613"/>
<g class="rise">
  <text x="40" y="40" class="mono accent" font-size="12" letter-spacing="2">01</text>
  <line x1="66" y1="36" x2="96" y2="36" stroke="#D97C69"/>
  <text x="106" y="40" class="cap">FEATURED RESEARCH</text>
  <text x="40" y="86" class="serif ink" font-size="36" letter-spacing="-.6">Claim-relative inference</text>
</g>
<g class="fade" style="animation-delay:0.3s">
  <text x="860" y="66" text-anchor="end" class="serif accent" font-size="18" font-style="italic">Ad fontes</text>
  <text x="860" y="86" text-anchor="end" class="cap" font-size="9">BACK TO THE SOURCES</text>
</g>
<line x1="40" y1="111" x2="860" y2="111" stroke="#36362F" class="draw" style="animation-delay:0.2s"/>
</svg>
