<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Xi Qin — From first principles to working code.">
<title>Xi Qin — From first principles to working code.</title>
<style>
.serif{font-family:Georgia, 'Times New Roman', 'Songti SC', 'STSong', SimSun, serif}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.cjk{font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif}
.ink{fill:#1B1D1B}.muted{fill:#6E6B62}.accent{fill:#8B2F25}
.cap{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:11px;letter-spacing:2.2px;fill:#6E6B62}
.rise,.fade,.grow,.draw,.blink{opacity:1;transform:none;stroke-dashoffset:0}
</style>

<rect width="900" height="400" rx="8" fill="#F3F0E8"/>
<g class="fade" style="animation-delay:0s">
  <text x="40" y="42" class="serif ink" font-size="22" font-style="italic">XQ</text>
  <text x="85" y="40" class="mono ink" font-size="12">XI QIN</text>
  <text x="860" y="40" text-anchor="end" class="cap">RESEARCH · OPEN SOURCE · 2026</text>
  <line x1="40" y1="62" x2="860" y2="62" stroke="#D8D1C1"/>
</g>
<text x="40" y="104" class="cap">WUHAN UNIVERSITY</text>
<g class="rise" style="animation-delay:0.1s"><text x="38" y="171" class="serif ink" font-size="58" letter-spacing="-1.5">From first <tspan class="accent" font-style="italic">principles</tspan></text></g>
<g class="rise" style="animation-delay:0.25s"><text x="38" y="235" class="serif ink" font-size="58" letter-spacing="-1.5">to working code.</text></g>
<g class="fade" style="animation-delay:0.4s">
  <text x="40" y="286" class="serif muted" font-size="18">Learning theory. Reproducible AI evaluation.</text>
  <text x="40" y="312" class="serif muted" font-size="18">Open-source systems that put ideas to work.</text>
</g>
<g transform="translate(590 75)" fill="none" stroke="#1B1D1B" stroke-width="1">
  <circle cx="130" cy="130" r="112" opacity=".2"/>
  <circle cx="130" cy="130" r="76" opacity=".1"/>
  <path d="M0 130H260M130 0V260" opacity=".15"/>
  <path d="M130 18 23 188 237 188Z M130 18 130 243 23 188 M130 243 237 188" class="draw" opacity=".7" style="animation-delay:0.3s"/>
  <path d="M130 18V243 M23 188 130 130 237 188" stroke-dasharray="4 5" opacity=".35"/>
  <path d="M130 18 23 188 237 188Z" fill="#8B2F25" fill-opacity=".06" stroke="none"/>
  <circle cx="130" cy="18" r="5" fill="#F3F0E8" stroke="#8B2F25" stroke-width="1.5"/><circle cx="23" cy="188" r="5" fill="#F3F0E8" stroke="#8B2F25" stroke-width="1.5"/><circle cx="237" cy="188" r="5" fill="#F3F0E8" stroke="#8B2F25" stroke-width="1.5"/><circle cx="130" cy="243" r="5" fill="#F3F0E8" stroke="#8B2F25" stroke-width="1.5"/>
  <circle cx="130" cy="130" r="4" fill="#8B2F25" stroke="none"/>
</g>
<line x1="40" y1="344" x2="860" y2="344" stroke="#D8D1C1"/>
<text x="40" y="375" class="serif accent" font-size="18" font-style="italic">Nullius in verba.</text>
<text x="860" y="374" text-anchor="end" class="cap">IDEAS WORTH PROVING. SYSTEMS WORTH BUILDING.</text>

</svg>
